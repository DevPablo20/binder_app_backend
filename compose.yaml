services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nest-app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8090:8090"
    env_file:
      - .env.development
    depends_on:
      - postgres_parametrization
    command: npm run start:dev
    tty: true
  postgres_parametrization:
    image: postgres:15-alpine
    restart: always
    shm_size: 128mb
    env_file:
      - .env.development
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
    volumes:
      - ./infra/postgres_data:/var/lib/postgresql/data
    ports:
      - "55432:5432"